<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> SignaTurk
</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg:        #0B0C10;
    --surface:   #13141A;
    --card:      #1C1D26;
    --border:    #2A2B38;
    --accent:    #7B68EE;
    --accent2:   #F5A623;
    --green:     #25D366;
    --green-dk:  #128C7E;
    --blue:      #4A9EFF;
    --blue-dk:   #1565C0;
    --red:       #FF4D6A;
    --text:      #E8E9F0;
    --text2:     #9192A8;
    --text3:     #4A4B5E;
    --bubble-l:  #1E3A2F;   /* işitme engelli — sol, yeşil ton */
    --bubble-r:  #1A2744;   /* normal birey — sağ, mavi ton */
    --radius:    18px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--text);
               font-family:'DM Sans',sans-serif; overflow:hidden; }

  /* ── LAYOUT ── */
  .app { display:grid; grid-template-columns:1fr 340px; grid-template-rows:52px 1fr 1fr auto;
         height:100vh; gap:0; }

  /* ── HEADER ── */
  .header { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
            background:var(--surface); border-bottom:1px solid var(--border);
            padding:0 20px; z-index:10; }
  .header-left { display:flex; align-items:center; gap:10px; }
  .logo { width:28px; height:28px; background:linear-gradient(135deg,var(--accent),var(--green));
          border-radius:8px; display:flex; align-items:center; justify-content:center;
          font-size:14px; }
  .header h1 { font-size:15px; font-weight:600; letter-spacing:0.3px; }
  .header-sub { font-size:11px; color:var(--text2); margin-left:4px; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green);
                box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ── SOL ÜST: Kamera ── */
  .cam-panel { grid-column:1; grid-row:2; background:var(--surface);
               border-right:1px solid var(--border); border-bottom:1px solid var(--border);
               display:flex; flex-direction:column; overflow:hidden; }
  .panel-header { padding:8px 14px; background:var(--card); border-bottom:1px solid var(--border);
                  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .panel-title { font-size:10px; font-weight:600; letter-spacing:1.5px;
                 color:var(--text2); text-transform:uppercase; }
  .panel-badge { font-size:10px; padding:2px 8px; border-radius:10px;
                 background:var(--card); border:1px solid var(--border); color:var(--text2); }
  .cam-img { width:100%; height:100%; object-fit:cover; display:block; }
  .cam-wrap { flex:1; overflow:hidden; position:relative; }

  /* Pred overlay */
  .pred-overlay { position:absolute; bottom:0; left:0; right:0;
                  background:linear-gradient(transparent,rgba(0,0,0,0.85));
                  padding:8px 12px; display:flex; align-items:center; gap:8px; }
  .pred-word { font-size:20px; font-weight:700; color:var(--green); font-family:'DM Mono'; }
  .pred-conf { font-size:11px; color:var(--text2); }
  .top5-list { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:2px; }
  .top5-item { font-size:10px; font-family:'DM Mono'; padding:1px 6px;
               background:rgba(0,0,0,0.6); border-radius:4px; color:var(--text2); }
  .top5-item.top { color:var(--green); }

  /* ── SAĞ ÜST: Animasyon ── */
  .anim-panel { grid-column:2; grid-row:2; background:var(--surface);
                border-bottom:1px solid var(--border);
                display:flex; flex-direction:column; overflow:hidden; }
  .anim-wrap { flex:1; position:relative; overflow:hidden; background:#0A0A12;
               display:flex; align-items:center; justify-content:center; }
  .anim-img { max-width:100%; max-height:100%; object-fit:contain; display:none; }
  .anim-placeholder { color:var(--text3); font-size:12px; text-align:center; }
  .anim-label-overlay { position:absolute; bottom:8px; left:12px;
                         font-size:16px; font-weight:700; color:var(--green);
                         font-family:'DM Mono'; text-shadow:0 0 8px rgba(37,211,102,0.5); }
  .sag-state-badge { font-size:10px; padding:2px 8px; border-radius:10px;
                     border:1px solid var(--border); }
  .sag-state-badge.bekle    { color:var(--accent2); border-color:var(--accent2); }
  .sag-state-badge.kayit    { color:var(--red);     border-color:var(--red); animation:pulse 1s infinite; }
  .sag-state-badge.isleniyor{ color:var(--accent2); border-color:var(--accent2); }
  .sag-state-badge.oynatma  { color:var(--green);   border-color:var(--green); }

  /* ── SOL ALT: Sohbet + Kontroller ── */
  .chat-panel { grid-column:1; grid-row:3/5; background:var(--surface);
                border-right:1px solid var(--border);
                display:flex; flex-direction:column; overflow:hidden; }

  /* Sohbet bölümü başlığı — iki kullanıcı */
  .chat-header { padding:8px 16px; background:var(--card); border-bottom:1px solid var(--border);
                 display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .user-badge { display:flex; align-items:center; gap:6px; }
  .user-avatar { width:26px; height:26px; border-radius:50%; display:flex;
                 align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .user-avatar.engelli { background:var(--green-dk); }
  .user-avatar.normal  { background:var(--blue-dk); }
  .user-name { font-size:11px; color:var(--text2); }

  /* Mesaj alanı */
  .messages { flex:1; overflow-y:auto; padding:12px 14px; display:flex;
              flex-direction:column; gap:6px; scroll-behavior:smooth; }
  .messages::-webkit-scrollbar { width:4px; }
  .messages::-webkit-scrollbar-track { background:transparent; }
  .messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  /* Mesaj balonları */
  .msg { display:flex; flex-direction:column; max-width:75%; animation:fadeSlide 0.25s ease; }
  @keyframes fadeSlide {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .msg.engelli { align-self:flex-start; }
  .msg.normal  { align-self:flex-end; }
  .bubble { padding:8px 12px; border-radius:var(--radius); font-size:13px;
            line-height:1.45; word-break:break-word; position:relative; }
  .msg.engelli .bubble {
    background:var(--bubble-l);
    border-bottom-left-radius:4px;
    border:1px solid rgba(37,211,102,0.15);
  }
  .msg.normal .bubble {
    background:var(--bubble-r);
    border-bottom-right-radius:4px;
    border:1px solid rgba(74,158,255,0.15);
  }
  .bubble-time { font-size:10px; color:var(--text3); margin-top:2px; }
  .msg.engelli .bubble-time { align-self:flex-start; padding-left:4px; }
  .msg.normal  .bubble-time { align-self:flex-end;   padding-right:4px; }
  .sender-label { font-size:10px; font-weight:600; margin-bottom:2px; }
  .msg.engelli .sender-label { color:var(--green); padding-left:4px; }
  .msg.normal  .sender-label { color:var(--blue);  padding-right:4px; text-align:right; }

  /* Buffer / typing indicator */
  .buffer-bar { padding:6px 14px; background:var(--card); border-top:1px solid var(--border);
                display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .buffer-label { font-size:10px; color:var(--text3); font-weight:600;
                  text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
  .buffer-text { font-size:13px; color:var(--accent2); font-family:'DM Mono';
                 flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Kontrol butonları */
  .controls { padding:8px 12px; background:var(--card);
              border-top:1px solid var(--border);
              display:flex; gap:6px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  .btn { display:flex; flex-direction:column; align-items:center; gap:1px;
         cursor:pointer; border:none; border-radius:10px; padding:7px 14px;
         font-family:'DM Sans'; transition:all 0.15s ease; }
  .btn span.label { font-size:12px; font-weight:600; }
  .btn span.key   { font-size:9px; color:var(--text3); }
  .btn:hover { filter:brightness(1.2); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-llm  { background:var(--accent); color:#fff; }
  .btn-clear{ background:var(--card); color:var(--text2); border:1px solid var(--border); }
  .btn-back { background:var(--card); color:var(--text2); border:1px solid var(--border); }

  /* Mod toggle */
  .mode-toggle { display:flex; background:var(--bg); border-radius:8px;
                 border:1px solid var(--border); overflow:hidden; margin-left:auto; }
  .mode-btn { padding:5px 12px; font-size:11px; font-weight:600; cursor:pointer;
              border:none; background:transparent; color:var(--text2);
              font-family:'DM Sans'; transition:all 0.15s; }
  .mode-btn.active { background:var(--accent); color:#fff; }

  .intent-toggle { display:flex; border-radius:10px; overflow:hidden;
                   border:1px solid var(--border); background:var(--bg); }
  .intent-btn { padding:6px 14px; font-size:11px; font-weight:600; cursor:pointer;
                border:none; background:transparent; font-family:'DM Sans';
                transition:all 0.15s; color:var(--text3); }
  .intent-btn.ifade.active { background:#1A2744; color:var(--blue); }
  .intent-btn.soru.active  { background:#2A1F3D; color:#C084FC; }

  /* ── SAĞ ALT: Ses kontrolleri ── */
  .ses-panel { grid-column:2; grid-row:3/5; background:var(--surface);
               display:flex; flex-direction:column; overflow:hidden; }
  .ses-info { flex:1; padding:12px 14px; overflow-y:auto; }
  .ses-info-title { font-size:10px; font-weight:600; letter-spacing:1.5px;
                    color:var(--text3); text-transform:uppercase; margin-bottom:8px; }
  .ses-transcript { font-size:13px; color:var(--text2); line-height:1.5;
                    padding:8px; background:var(--card); border-radius:10px;
                    min-height:40px; border:1px solid var(--border); }
  .ses-controls { padding:10px 12px; background:var(--card);
                  border-top:1px solid var(--border);
                  display:flex; gap:6px; flex-direction:column; }
  .ses-btn-row { display:flex; gap:6px; }
  .btn-kaydet { background:#1E3A2F; color:var(--green); border:1px solid rgba(37,211,102,0.3); }
  .btn-kaydet.kayit { background:var(--red); color:#fff; border-color:var(--red); animation:pulse 1s infinite; }
  .btn-isle   { background:#1A2744; color:var(--blue); border:1px solid rgba(74,158,255,0.3); }
  .btn-sifirla{ background:var(--card); color:var(--text2); border:1px solid var(--border); }

  /* LLM status */
  .llm-status { font-size:12px; padding:4px 8px; border-radius:8px;
                background:var(--card); color:var(--text2); text-align:center;
                border:1px solid var(--border); display:none; }
  .llm-status.visible { display:block; }
  .llm-status.thinking { color:var(--accent2); border-color:var(--accent2); }
  .llm-status.done     { color:var(--green);   border-color:var(--green); }

  /* Ses dalga animasyonu */
  .wave { display:none; align-items:center; gap:3px; height:20px; }
  .wave.active { display:flex; }
  .wave-bar { width:3px; border-radius:2px; background:var(--red);
              animation:wave-anim 0.8s ease-in-out infinite; }
  .wave-bar:nth-child(2){ animation-delay:.1s; }
  .wave-bar:nth-child(3){ animation-delay:.2s; }
  .wave-bar:nth-child(4){ animation-delay:.3s; }
  .wave-bar:nth-child(5){ animation-delay:.2s; }
  @keyframes wave-anim {
    0%,100%{ height:4px; } 50%{ height:16px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">◈</div>
      <h1>SignaTurk</h1>
      <span class="header-sub">İşaret Dili ↔ Konuşma</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="model-status" style="font-size:11px;color:var(--text3)">Modeller yükleniyor...</span>
      <div class="status-dot"></div>
    </div>
  </header>

  <!-- KAMERA PANELİ -->
  <div class="cam-panel">
    <div class="panel-header">
      <span class="panel-title">Kamera — İşaret Tanıma</span>
      <span class="panel-badge" id="mode-badge">KELIME</span>
    </div>
    <div class="cam-wrap">
      <img class="cam-img" src="/video_feed" alt="Kamera">
      <div class="top5-list" id="top5-list"></div>
      <div class="pred-overlay">
        <span class="pred-word" id="pred-word"></span>
        <span class="pred-conf" id="pred-conf"></span>
      </div>
    </div>
  </div>

  <!-- ANİMASYON PANELİ -->
  <div class="anim-panel">
    <div class="panel-header">
      <span class="panel-title">Animasyon</span>
      <span class="sag-state-badge bekle" id="sag-state-badge">● Hazır</span>
    </div>
    <div class="anim-wrap">
      <img class="anim-img" id="anim-img" alt="Animasyon">
      <div class="anim-placeholder" id="anim-placeholder">
        <div style="font-size:28px;margin-bottom:8px"></div>
        Ses kaydedip işleyin
      </div>
      <div class="anim-label-overlay" id="anim-label"></div>
    </div>
  </div>

  <!-- SOHBET PANELİ -->
  <div class="chat-panel">
    <!-- Kullanıcı başlıkları -->
    <div class="chat-header">
      <div class="user-badge">
        <div class="user-avatar engelli">İE</div>
        <span class="user-name">İşitme Engelli</span>
      </div>
      <span style="font-size:11px;color:var(--text3)">Sohbet</span>
      <div class="user-badge">
        <span class="user-name">Normal Birey</span>
        <div class="user-avatar normal">NB</div>
      </div>
    </div>

    <!-- Mesajlar -->
    <div class="messages" id="messages"></div>

    <!-- Buffer göstergesi -->
    <div class="buffer-bar">
      <span class="buffer-label">Biriken</span>
      <span class="buffer-text" id="buffer-text">—</span>
      <div class="llm-status" id="llm-status"></div>
    </div>

    <!-- Kontroller -->
    <div class="controls">
      <button class="btn btn-llm" onclick="socket.emit('llm_isle')">
        <span class="label">LLM + TTS</span>
        <span class="key">N</span>
      </button>
      <button class="btn btn-clear" onclick="socket.emit('temizle')">
        <span class="label">✕ Temizle</span>
        <span class="key">C</span>
      </button>
      <button class="btn btn-back" onclick="socket.emit('backspace')">
        <span class="label">⌫ Sil</span>
        <span class="key">B</span>
      </button>
      <div class="mode-toggle">
        <button class="mode-btn"        id="btn-harf" onclick="setMode('harf')">Harf</button>
        <button class="mode-btn active" id="btn-kelime" onclick="setMode('kelime')">Kelime</button>
      </div>
      <div class="intent-toggle">
        <button class="intent-btn ifade active" id="btn-ifade" onclick="setIntent('ifade')">&#x1F4AC; İfade</button>
        <button class="intent-btn soru"         id="btn-soru"  onclick="setIntent('soru')">&#x2753; Soru</button>
      </div>
    </div>
  </div>

  <!-- SES PANELİ -->
  <div class="ses-panel">
    <div class="panel-header">
      <span class="panel-title">🎙️ Ses — Normal Birey</span>
    </div>
    <div class="ses-info">
      <div class="ses-info-title">Tanınan Metin</div>
      <div class="ses-transcript" id="ses-transcript">—</div>
    </div>
    <div class="ses-controls">
      <div class="ses-btn-row">
        <button class="btn btn-kaydet" id="btn-kaydet" onclick="toggleKayit()"
                style="flex:1">
          <span class="label" id="kaydet-label">⏺ Kaydet</span>
          <div class="wave" id="wave">
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
          <span class="key">R</span>
        </button>
        <button class="btn btn-isle" id="btn-isle" onclick="socket.emit('kayit_bitir')"
                style="flex:1">
          <span class="label">▶ İşle</span>
          <span class="key">SPACE</span>
        </button>
      </div>
      <button class="btn btn-sifirla" onclick="socket.emit('sifirla')" style="width:100%">
        <span class="label">↺ Sıfırla</span>
      </button>
    </div>
  </div>

</div><!-- .app -->

<script>
const socket = io();
let isKayit = false;
let currentMode = 'kelime';

// ── Bağlantı ──────────────────────────────────────────────────────────────
socket.on('connect', () => console.log('Bağlandı'));

socket.on('chat_history', (msgs) => {
  document.getElementById('messages').innerHTML = '';
  msgs.forEach(addMessage);
  scrollToBottom();
});

socket.on('system_status', (d) => {
  const el = document.getElementById('model-status');
  el.textContent = d.msg;
  if (d.ok) el.style.color = 'var(--green)';
});

// ── Sohbet mesajları ──────────────────────────────────────────────────────
socket.on('new_message', (msg) => {
  addMessage(msg);
  scrollToBottom();
});

function addMessage(msg) {
  const cont = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${msg.sender}`;

  const isEngelli = msg.sender === 'engelli';
  const name = isEngelli ? ' İşitme Engelli' : ' Normal Birey';

  div.innerHTML = `
    <span class="sender-label">${name}</span>
    <div class="bubble">${escHtml(msg.text)}</div>
    <span class="bubble-time">${msg.time}</span>
  `;
  cont.appendChild(div);
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Buffer ────────────────────────────────────────────────────────────────
socket.on('buffer_update', (d) => {
  document.getElementById('buffer-text').textContent = d.text || '—';
});

// ── Tahmin overlay ────────────────────────────────────────────────────────
socket.on('pred_update', (d) => {
  document.getElementById('pred-word').textContent = d.pred || '';
  document.getElementById('pred-conf').textContent =
    d.conf > 0 ? `${Math.round(d.conf*100)}%` : '';

  const list = document.getElementById('top5-list');
  list.innerHTML = (d.top5||[]).map((item,i) =>
    `<div class="top5-item ${i===0?'top':''}">${item[0]}:${Math.round(item[1]*100)}%</div>`
  ).join('');
});

// ── LLM durumu ────────────────────────────────────────────────────────────
socket.on('llm_status', (d) => {
  const el = document.getElementById('llm-status');
  el.classList.add('visible');
  if (d.status === 'thinking') {
    el.textContent = '⟳ LLM düşünüyor...';
    el.className = 'llm-status visible thinking';
  } else {
    el.textContent = `✓ ${d.text}`;
    el.className = 'llm-status visible done';
    setTimeout(() => {
      el.classList.remove('visible');
    }, 3000);
  }
});

// ── Sağ panel durumu ──────────────────────────────────────────────────────
const sagStateMap = {
  bekle:     { text:'● Hazır',       cls:'bekle'     },
  kayit:     { text:'⏺ Kaydediliyor', cls:'kayit'     },
  isleniyor: { text:'⟳ İşleniyor',    cls:'isleniyor' },
  oynatma:   { text:'▶ Oynatılıyor',  cls:'oynatma'   },
};
socket.on('sag_state', (d) => {
  const s = sagStateMap[d.state] || sagStateMap.bekle;
  const badge = document.getElementById('sag-state-badge');
  badge.textContent = s.text;
  badge.className = `sag-state-badge ${s.cls}`;
});

socket.on('whisper_result', (d) => {
  document.getElementById('ses-transcript').textContent = d.text || '—';
});

// ── Animasyon ─────────────────────────────────────────────────────────────
socket.on('anim_frame', (d) => {
  const img = document.getElementById('anim-img');
  const ph  = document.getElementById('anim-placeholder');
  img.src = 'data:image/jpeg;base64,' + d.data;
  img.style.display = 'block';
  ph.style.display  = 'none';
  document.getElementById('anim-label').textContent = d.label.toUpperCase();
});

socket.on('sag_state', (d) => {
  if (d.state === 'bekle') {
    const img = document.getElementById('anim-img');
    const ph  = document.getElementById('anim-placeholder');
    img.style.display = 'none';
    ph.style.display  = 'flex';
    document.getElementById('anim-label').textContent = '';
  }
});

// ── Mod değiştirme ────────────────────────────────────────────────────────
socket.on('mode_change', (d) => {
  currentMode = d.mode;
  document.getElementById('btn-harf').classList.toggle('active', d.mode==='harf');
  document.getElementById('btn-kelime').classList.toggle('active', d.mode==='kelime');
  document.getElementById('mode-badge').textContent = d.mode.toUpperCase();
});

function setMode(m) {
  socket.emit('set_mode', {mode: m});
}

function setIntent(intent) {
  socket.emit('set_intent', {intent: intent});
}

socket.on('intent_change', (d) => {
  document.getElementById('btn-ifade').classList.toggle('active', d.intent === 'ifade');
  document.getElementById('btn-soru').classList.toggle('active',  d.intent === 'soru');
});

// ── Kayıt butonu ──────────────────────────────────────────────────────────
function toggleKayit() {
  if (!isKayit) {
    socket.emit('kayit_baslat');
    isKayit = true;
    const btn = document.getElementById('btn-kaydet');
    btn.classList.add('kayit');
    document.getElementById('kaydet-label').textContent = '⏹ Dur';
    document.getElementById('wave').classList.add('active');
  } else {
    socket.emit('kayit_bitir');
    isKayit = false;
    const btn = document.getElementById('btn-kaydet');
    btn.classList.remove('kayit');
    document.getElementById('kaydet-label').textContent = '⏺ Kaydet';
    document.getElementById('wave').classList.remove('active');
  }
}

socket.on('sag_state', (d) => {
  if (d.state === 'bekle' && isKayit) {
    isKayit = false;
    document.getElementById('btn-kaydet').classList.remove('kayit');
    document.getElementById('kaydet-label').textContent = '⏺ Kaydet';
    document.getElementById('wave').classList.remove('active');
  }
});

// ── Klavye kısayolları ────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  switch(e.key.toLowerCase()) {
    case 'n': socket.emit('llm_isle');   break;
    case 'c': socket.emit('temizle');    break;
    case 'b': socket.emit('backspace');  break;
    case 'r': toggleKayit();             break;
    case ' ': e.preventDefault(); socket.emit('kayit_bitir'); break;
  }
});
</script>
</body>
</html>
